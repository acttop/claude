name: Build Windows EXE

on:
  push:
    branches: [pdf2excel]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt pytest reportlab
      - name: Test
        run: python -m pytest tests -q
      - name: Build
        run: >
          pyinstaller --noconfirm --onefile --windowed --name PDF2Excel
          --collect-all pdfplumber --collect-all pypdfium2 run_gui.py
      - name: Smoke test (CLI mode)
        shell: pwsh
        run: |
          $p = Start-Process dist\PDF2Excel.exe -ArgumentList "samples\sample.pdf","-o","smoke.xlsx" -Wait -PassThru
          if (-not (Test-Path smoke.xlsx)) { Write-Error "exe 변환 실패 (exit $($p.ExitCode))"; exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: PDF2Excel-windows
          path: dist/PDF2Excel.exe
