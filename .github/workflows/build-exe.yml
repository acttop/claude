name: Build Windows EXE

on:
  push:
    branches: [pdf2excel]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt pytest reportlab
      - name: OCR data and test font
        shell: pwsh
        run: |
          python scripts/fetch_tessdata.py
          New-Item -ItemType Directory -Force tests/fonts | Out-Null
          Invoke-WebRequest https://raw.githubusercontent.com/google/fonts/main/ofl/nanumgothic/NanumGothic-Regular.ttf -OutFile tests/fonts/NanumGothic-Regular.ttf
      - name: Test
        run: python -m pytest tests -q
      - name: Build
        run: >
          pyinstaller --noconfirm --onefile --windowed --name PDF2Excel
          --collect-all pdfplumber --collect-all pypdfium2 --collect-all tesserocr
          --add-data "tessdata;tessdata" run_gui.py
      - name: Smoke test (text PDF + scanned PDF via exe)
        shell: pwsh
        run: |
          python tests/make_scan.py
          Start-Process dist\PDF2Excel.exe -ArgumentList "samples\sample.pdf","-o","smoke.xlsx" -Wait
          Start-Process dist\PDF2Excel.exe -ArgumentList "scan_sample.pdf","-o","smoke_scan.xlsx" -Wait
          python -c "from openpyxl import load_workbook as L; a=L('smoke.xlsx'); b=L('smoke_scan.xlsx'); print(a.sheetnames, b.sheetnames); r=list(b['P1_표1'].iter_rows(values_only=True)); print(r[:3]); assert r[1][0]=='N-01', r"
      - uses: actions/upload-artifact@v4
        with:
          name: PDF2Excel-windows
          path: dist/PDF2Excel.exe
