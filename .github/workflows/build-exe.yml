name: Build Windows EXE

on:
  push:
    branches: [pdf2excel]
  workflow_dispatch:

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt pytest reportlab
      - name: OCR data and test font
        shell: pwsh
        run: |
          python scripts/fetch_tessdata.py
          New-Item -ItemType Directory -Force tests/fonts | Out-Null
          Invoke-WebRequest https://raw.githubusercontent.com/google/fonts/main/ofl/nanumgothic/NanumGothic-Regular.ttf -OutFile tests/fonts/NanumGothic-Regular.ttf
      - name: Test
        run: python -m pytest tests -q --junitxml=junit.xml
      - name: Report test failures
        if: failure()
        run: >
          python -c "import xml.etree.ElementTree as E;
          [print('::error::' + (c.get('name') or '') + ' | ' + ((f.get('message') or '') + ' ' + (f.text or '')).replace(chr(10), ' / ')[:3000])
          for c in E.parse('junit.xml').iter('testcase') for f in list(c) if f.tag in ('failure', 'error')]"
      - name: Build
        run: >
          pyinstaller --noconfirm --onefile --windowed --name PDF2Excel
          --collect-all pdfplumber --collect-all pypdfium2 --collect-all tesserocr
          --add-data "tessdata;tessdata" run_gui.py
      - name: Smoke test (text PDF + scanned PDF via exe)
        run: |
          python tests/make_scan.py
          python tests/smoke_exe.py
      - uses: actions/upload-artifact@v4
        with:
          name: PDF2Excel-windows
          path: dist/PDF2Excel.exe
