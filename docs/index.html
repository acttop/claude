<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="자산스캐너">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<title>자산 스캐너</title>
<style>
  :root {
    --bg: #000;
    --bg2: #1c1c1e;
    --bg3: #2c2c2e;
    --bg4: #3a3a3c;
    --sep: #38383a;
    --txt: #fff;
    --txt2: #ebebf599;
    --txt3: #ebebf54d;
    --blue: #0a84ff;
    --red: #ff453a;
    --green: #30d158;
    --yellow: #ffd60a;
    --orange: #ff9f0a;
    --purple: #bf5af2;
    --tab-h: 83px;
    --safe-top: env(safe-area-inset-top, 44px);
    --safe-bot: env(safe-area-inset-bottom, 34px);
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f2f2f7;
      --bg2: #fff;
      --bg3: #f2f2f7;
      --bg4: #e5e5ea;
      --sep: #c6c6c8;
      --txt: #000;
      --txt2: #3c3c4399;
      --txt3: #3c3c434d;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: var(--bg); color: var(--txt); font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif; overflow: hidden; }

  #app { display: flex; flex-direction: column; height: 100%; }

  /* ── SCREENS ── */
  .screen { display: none; flex: 1; flex-direction: column; overflow: hidden; }
  .screen.active { display: flex; }

  .scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: 16px; }
  .scroll::-webkit-scrollbar { display: none; }

  /* ── NAV BAR ── */
  .nav-bar {
    padding-top: var(--safe-top);
    background: rgba(28,28,30,.85);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-bottom: 0.5px solid var(--sep);
    flex-shrink: 0;
    z-index: 10;
  }
  @media (prefers-color-scheme: light) {
    .nav-bar { background: rgba(242,242,247,.85); }
  }
  .nav-title { text-align: center; padding: 12px 60px; font-size: 17px; font-weight: 600; }
  .nav-btn { position: absolute; top: calc(var(--safe-top) + 8px); font-size: 17px; color: var(--blue); background: none; border: none; cursor: pointer; padding: 4px 12px; }
  .nav-btn.left { left: 0; }
  .nav-btn.right { right: 0; }

  /* ── TAB BAR ── */
  .tab-bar {
    height: var(--tab-h);
    padding-bottom: var(--safe-bot);
    background: rgba(28,28,30,.85);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-top: 0.5px solid var(--sep);
    display: flex;
    align-items: flex-start;
    flex-shrink: 0;
  }
  @media (prefers-color-scheme: light) {
    .tab-bar { background: rgba(242,242,247,.85); }
  }
  .tab-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding-top: 10px; cursor: pointer; color: var(--txt3); font-size: 10px; border: none; background: none; }
  .tab-item.active { color: var(--blue); }
  .tab-item svg { width: 24px; height: 24px; }

  /* ── CARDS ── */
  .card { background: var(--bg2); border-radius: 16px; margin: 8px 16px; overflow: hidden; }
  .card-row { padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 0.5px solid var(--sep); }
  .card-row:last-child { border-bottom: none; }
  .card-section { padding: 8px 0; }
  .section-header { padding: 6px 32px; font-size: 13px; color: var(--txt2); font-weight: 400; }

  /* ── SUMMARY CARD ── */
  .summary-card { background: var(--bg2); border-radius: 20px; margin: 8px 16px; padding: 20px; }
  .summary-total { font-size: 32px; font-weight: 700; letter-spacing: -0.5px; }
  .summary-sub { font-size: 13px; color: var(--txt2); margin-top: 2px; }
  .summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
  .summary-cell { background: var(--bg3); border-radius: 12px; padding: 12px; }
  .cell-label { font-size: 11px; color: var(--txt2); margin-bottom: 4px; }
  .cell-value { font-size: 16px; font-weight: 600; }
  .cell-pct { font-size: 12px; margin-top: 2px; }

  .profit { color: #ff453a; }
  .loss   { color: #0a84ff; }
  .neutral { color: var(--txt2); }

  /* ── CHART ── */
  .chart-wrap { margin: 8px 16px; background: var(--bg2); border-radius: 16px; padding: 16px; }
  .chart-title { font-size: 13px; font-weight: 600; margin-bottom: 12px; }
  canvas { width: 100%; border-radius: 8px; }

  /* ── LIST ── */
  .record-item { padding: 14px 16px; border-bottom: 0.5px solid var(--sep); cursor: pointer; active-opacity: 0.5; }
  .record-item:last-child { border-bottom: none; }
  .record-item:active { background: var(--bg3); }
  .record-date { font-size: 15px; font-weight: 600; }
  .record-meta { font-size: 13px; color: var(--txt2); margin-top: 2px; }
  .record-values { text-align: right; }

  /* ── FORM ── */
  .form-group { padding: 12px 16px; border-bottom: 0.5px solid var(--sep); display: flex; align-items: center; gap: 12px; }
  .form-group:last-child { border-bottom: none; }
  .form-label { font-size: 15px; min-width: 80px; flex-shrink: 0; }
  .form-input { flex: 1; background: none; border: none; color: var(--txt); font-size: 15px; text-align: right; outline: none; font-family: inherit; }
  .form-input::placeholder { color: var(--txt3); }
  select.form-input { -webkit-appearance: none; }

  /* ── BUTTONS ── */
  .btn { border: none; border-radius: 12px; font-size: 16px; font-weight: 600; padding: 14px; width: 100%; cursor: pointer; font-family: inherit; }
  .btn-primary { background: var(--blue); color: #fff; }
  .btn-danger  { background: var(--red);  color: #fff; }
  .btn-secondary { background: var(--bg3); color: var(--txt); }
  .btn-wrap { padding: 12px 16px; }
  .btn:active { opacity: 0.8; }

  /* ── REBALANCING ── */
  .rebal-bar-wrap { height: 6px; background: var(--bg4); border-radius: 3px; overflow: hidden; }
  .rebal-bar-fill { height: 100%; border-radius: 3px; transition: width .3s; }

  .badge { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 10px; }
  .badge-buy { background: rgba(255,69,58,.15); color: var(--red); }
  .badge-ok  { background: rgba(48,209,88,.15);  color: var(--green); }
  .badge-over { background: rgba(10,132,255,.15); color: var(--blue); }

  /* ── SETTINGS ── */
  .setting-toggle { position: relative; width: 51px; height: 31px; flex-shrink: 0; }
  .toggle-input { opacity: 0; width: 0; height: 0; position: absolute; }
  .toggle-slider {
    position: absolute; inset: 0; background: var(--bg4); border-radius: 31px; cursor: pointer;
    transition: background .2s;
  }
  .toggle-slider::before {
    content: ''; position: absolute; height: 27px; width: 27px; left: 2px; bottom: 2px;
    background: white; border-radius: 50%; transition: transform .2s;
    box-shadow: 0 2px 4px rgba(0,0,0,.3);
  }
  .toggle-input:checked + .toggle-slider { background: var(--green); }
  .toggle-input:checked + .toggle-slider::before { transform: translateX(20px); }

  /* ── MODAL ── */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 100; display: none; align-items: flex-end; }
  .modal-overlay.open { display: flex; }
  .modal-sheet { background: var(--bg2); border-radius: 20px 20px 0 0; width: 100%; max-height: 90vh; overflow-y: auto; padding-bottom: var(--safe-bot); }
  .modal-handle { width: 36px; height: 5px; background: var(--bg4); border-radius: 3px; margin: 10px auto 16px; }
  .modal-title { font-size: 17px; font-weight: 700; padding: 0 20px 16px; }

  /* ── ASSET DETAIL ── */
  .asset-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 0.5px solid var(--sep); }
  .asset-row:last-child { border-bottom: none; }
  .asset-name { font-size: 15px; font-weight: 500; }
  .asset-sym  { font-size: 12px; color: var(--txt2); margin-top: 1px; }
  .asset-right { text-align: right; }

  /* ── RATE BANNER ── */
  .rate-banner { margin: 0 16px 4px; background: var(--bg2); border-radius: 12px; padding: 10px 16px; display: flex; justify-content: space-between; align-items: center; }
  .rate-val { font-size: 18px; font-weight: 700; }
  .rate-time { font-size: 11px; color: var(--txt2); }

  /* ── EMPTY STATE ── */
  .empty { text-align: center; padding: 60px 20px; color: var(--txt2); }
  .empty-icon { font-size: 48px; margin-bottom: 12px; }
  .empty-title { font-size: 20px; font-weight: 600; color: var(--txt); margin-bottom: 8px; }
  .empty-desc { font-size: 14px; line-height: 1.5; }

  /* ── CAMERA ── */
  #camera-input { display: none; }
  #scan-img-el { display: block; }

  /* ── TOAST ── */
  .toast { position: fixed; bottom: calc(var(--tab-h) + 16px); left: 50%; transform: translateX(-50%); background: rgba(50,50,50,.95); color: #fff; padding: 10px 20px; border-radius: 20px; font-size: 14px; z-index: 200; opacity: 0; transition: opacity .3s; white-space: nowrap; }
  .toast.show { opacity: 1; }

  /* ── WEIGHT BAR ── */
  .weight-pill { display: inline-block; height: 8px; border-radius: 4px; }

  /* Pull-to-refresh simulation */
  .ptr-indicator { text-align: center; padding: 12px; font-size: 13px; color: var(--txt2); }

  input[type=number] { -moz-appearance: textfield; }
  input[type=number]::-webkit-outer-spin-button,
  input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; }
</style>
</head>
<body>
<div id="app">

  <!-- ===== DASHBOARD SCREEN ===== -->
  <div class="screen active" id="screen-dashboard">
    <div class="nav-bar" style="position:relative">
      <div class="nav-title">대시보드</div>
      <button class="nav-btn right" onclick="openScanModal()">＋</button>
    </div>
    <div class="scroll" id="dash-scroll">
      <div id="dash-content"></div>
    </div>
  </div>

  <!-- ===== RECORDS SCREEN ===== -->
  <div class="screen" id="screen-records">
    <div class="nav-bar" style="position:relative">
      <div class="nav-title">기록</div>
      <button class="nav-btn right" onclick="openScanModal()">＋</button>
    </div>
    <div class="scroll">
      <div id="records-list"></div>
    </div>
  </div>

  <!-- ===== REBALANCING SCREEN ===== -->

      <div class="nav-title">리밸런싱</div>

    <div class="scroll">

    </div>
  </div>

  <!-- ===== SETTINGS SCREEN ===== -->
  <div class="screen" id="screen-settings">

      <div class="nav-title">설정</div>
    </div>
    <div class="scroll">
      <div id="settings-content"></div>
    </div>
  </div>

  <!-- ===== TAB BAR ===== -->
  <nav class="tab-bar">
    <button class="tab-item active" onclick="switchTab('dashboard',this)">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg>
      대시보드
    </button>
    <button class="tab-item" onclick="switchTab('records',this)">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6zm-1 7V3.5L18.5 9H13zM6 4h6v6h6v10H6V4z"/></svg>
      기록
    </button>
    <button class="tab-item" onclick="switchTab('rebal',this)">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17 12h-5v5h5v-5zM16 1v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2h-1V1h-2zm3 18H5V8h14v11z"/></svg>
      리밸런싱
    </button>
    <button class="tab-item" onclick="switchTab('settings',this)">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 15.5A3.5 3.5 0 018.5 12 3.5 3.5 0 0112 8.5a3.5 3.5 0 013.5 3.5 3.5 3.5 0 01-3.5 3.5m7.43-2.92c.04-.34.07-.68.07-1.08 0-.4-.03-.74-.07-1.08l2.33-1.82c.21-.16.27-.45.14-.69l-2.2-3.82c-.13-.24-.41-.32-.65-.24l-2.75 1.1c-.57-.44-1.18-.79-1.85-1.06L14.5 2.42c-.04-.26-.27-.42-.5-.42h-4c-.23 0-.46.16-.5.42L9.17 5.09c-.67.27-1.28.62-1.85 1.06L4.57 5.05c-.24-.08-.52 0-.65.24l-2.2 3.82c-.14.24-.08.53.14.69l2.33 1.82c-.04.34-.07.69-.07 1.08s.03.74.07 1.08L1.86 15.6c-.22.16-.28.45-.14.69l2.2 3.82c.13.24.41.32.65.24l2.75-1.1c.57.44 1.18.79 1.85 1.06l.41 2.67c.04.26.27.42.5.42h4c.23 0 .46-.16.5-.42l.41-2.67c.67-.27 1.28-.62 1.85-1.06l2.75 1.1c.24.08.52 0 .65-.24l2.2-3.82c.14-.24.08-.53-.14-.69l-2.33-1.82z"/></svg>
      설정
    </button>

</div>

<!-- ===== MODALS ===== -->

<!-- Scan Modal -->
<div class="modal-overlay" id="scan-modal">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title">자산 기록 추가</div>
    <div class="card">
      <div class="form-group">
        <span class="form-label">날짜</span>
        <input class="form-input" type="date" id="scan-date">
      </div>
    </div>
    <div id="scan-img-preview" style="display:none;margin:0 16px 4px;position:relative">
      <img id="scan-img-el" style="width:100%;border-radius:12px;max-height:220px;object-fit:contain;background:#000" src="">
      <button onclick="clearScanImage()" style="position:absolute;top:8px;right:8px;background:rgba(0,0,0,.6);border:none;color:#fff;border-radius:50%;width:28px;height:28px;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center">×</button>
    </div>
    <div id="ocr-status" style="display:none;margin:4px 16px;padding:10px 14px;background:var(--bg3);border-radius:10px;font-size:13px;color:var(--txt2);text-align:center"></div>
    <div id="ocr-summary" style="display:none;margin:4px 16px;padding:10px 14px;background:var(--bg3);border-radius:10px;font-size:12px;line-height:1.7"></div>
    <div class="section-header" style="margin-top:8px">보유 자산</div>
    <div class="card" id="scan-assets-list"></div>
    <div class="btn-wrap" style="display:flex;gap:8px">
      <button class="btn btn-secondary" style="width:auto;padding:14px 20px" onclick="addScanAssetRow()">＋ 종목 추가</button>
      <button class="btn btn-primary" onclick="captureScan()">

      </button>
    </div>
    <div class="btn-wrap" style="padding-top:0">
      <button class="btn btn-primary" onclick="saveScanRecord()">저장</button>
    </div>
    <div class="btn-wrap" style="padding-top:0">
      <button class="btn btn-secondary" onclick="closeModal('scan-modal')">취소</button>
    </div>
  </div>
</div>
<input type="file" id="camera-input" accept="image/*" onchange="processImage(event)">

<!-- Record Detail Modal -->
<div class="modal-overlay" id="detail-modal">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div style="display:flex;align-items:center;padding:0 20px 16px;gap:8px">
      <div id="detail-title" style="font-size:17px;font-weight:700;flex:1"></div>
      <button id="detail-edit-btn" style="background:var(--blue);color:#fff;border:none;border-radius:10px;padding:6px 16px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit">수정</button>
    </div>
    <div id="detail-content"></div>
    <div class="btn-wrap" style="display:flex;gap:8px">
      <button class="btn btn-danger" id="detail-delete-btn" style="flex:1">삭제</button>
      <button class="btn btn-secondary" onclick="closeModal('detail-modal')" style="flex:1">닫기</button>

</div>

<!-- Add Portfolio Asset Modal -->
<div class="modal-overlay" id="add-asset-modal">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title" id="add-asset-title">ETF 추가</div>
    <div class="card">
      <div class="form-group">
        <span class="form-label">종목명</span>
        <input class="form-input" type="text" id="pa-name" placeholder="TIGER 미국S&P500">
      </div>
      <div class="form-group">
        <span class="form-label">심볼</span>
        <input class="form-input" type="text" id="pa-symbol" placeholder="379800">
      </div>
      <div class="form-group">
        <span class="form-label">통화</span>
        <select class="form-input" id="pa-currency">
          <option value="KRW">KRW</option>
          <option value="USD">USD</option>
        </select>
      </div>
      <div class="form-group">
        <span class="form-label">목표 비중 %</span>
        <input class="form-input" type="number" id="pa-target" placeholder="20" min="0" max="100">
      </div>
      <div class="form-group">
        <span class="form-label">현재가</span>
        <input class="form-input" type="number" id="pa-price" placeholder="16800">
      </div>
      <div class="form-group">
        <span class="form-label">보유수량</span>

      </div>
      <div class="form-group">
        <span class="form-label">카테고리</span>
        <input class="form-input" type="text" id="pa-cat" placeholder="해외주식">
      </div>
    </div>
    <div class="btn-wrap">
      <button class="btn btn-primary" id="pa-save-btn" onclick="savePortfolioAsset()">추가</button>
    </div>
    <div class="btn-wrap" style="padding-top:0">
      <button class="btn btn-secondary" onclick="closeModal('add-asset-modal')">취소</button>
    </div>
  </div>
</div>

<!-- Rebalancing Calc Modal -->
<div class="modal-overlay" id="calc-modal">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title">리밸런싱 계산</div>
    <div class="card">
      <div class="form-group">
        <span class="form-label">추가 투자금</span>
        <input class="form-input" type="number" id="calc-amount" placeholder="1000000">
        <span style="font-size:14px;color:var(--txt2);margin-left:4px">원</span>
      </div>
    </div>
    <div class="btn-wrap">
      <button class="btn btn-primary" onclick="runRebalCalc()">계산하기</button>
    </div>
    <div id="calc-results"></div>
    <div class="btn-wrap">
      <button class="btn btn-secondary" onclick="closeModal('calc-modal')">닫기</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ═══════════════════════════════════════════
//  DATA LAYER
// ═══════════════════════════════════════════
const LS = {
  get: (k, def) => { try { return JSON.parse(localStorage.getItem(k)) ?? def; } catch { return def; } },
  set: (k, v) => localStorage.setItem(k, JSON.stringify(v))
};

// 자산 스키마: 상품명(name) / 매입금액(buyAmount) / 보유수량(qty) / 매입단가(avgPrice) / 평가금액(evalAmount)
// 구버전 데이터({price} 기반)는 로드 시 자동 변환
function migrateAsset(a) {
  if (a.buyAmount !== undefined && a.evalAmount !== undefined) return a;
  return {
    name: a.name, symbol: a.symbol || '',
    qty: a.qty || 0, avgPrice: a.avgPrice || 0,
    buyAmount: a.buyAmount ?? Math.round((a.qty || 0) * (a.avgPrice || 0)),
    evalAmount: a.evalAmount ?? Math.round((a.qty || 0) * (a.price || 0))
  };
}

let scanRecords = LS.get('scanRecords', []).map(r => ({ ...r, assets: (r.assets || []).map(migrateAsset) }));
let portfolio   = LS.get('portfolio', { name: '연금 포트폴리오', assets: [] });
let settings    = LS.get('settings', { alertEnabled: false, alertThreshold: 1300, darkMode: 'auto', targetWeights: {} });
let usdKrw      = 0;
let usdKrwTime  = null;
let editingAssetId = null;
let editingRecordId = null;

function save() {
  LS.set('scanRecords', scanRecords);
  LS.set('portfolio', portfolio);
}

// ─ Sorted records (newest first)
function sortedRecords() {
  return [...scanRecords].sort((a,b) => new Date(b.date) - new Date(a.date));
}

// ─ P&L helpers
function dailyPnL(record) {
  const sorted = sortedRecords();
  const idx = sorted.findIndex(r => r.id === record.id);
  if (idx < 0 || idx === sorted.length - 1) return 0;
  const prev = sorted[idx + 1];
  return record.totalValue - prev.totalValue;
}

function totalValue(record) {
  return (record.assets || []).reduce((s, a) => s + (a.evalAmount || 0), 0);
}
function totalInvestment(record) {
  return (record.assets || []).reduce((s, a) => s + (a.buyAmount || 0), 0);
}

// Attach computed totals
function enrich(records) {
  return records.map(r => ({
    ...r,
    totalValue: totalValue(r),
    totalInvestment: totalInvestment(r),
    get totalPnL() { return this.totalValue - this.totalInvestment; },
    get totalPnLPct() { return this.totalInvestment > 0 ? (this.totalPnL / this.totalInvestment) * 100 : 0; }
  }));
}

// ═══════════════════════════════════════════
//  FORMAT HELPERS
// ═══════════════════════════════════════════
function fmt(n, digits=0) {
  if (Math.abs(n) >= 1e8) return (n/1e8).toFixed(1) + '억원';
  if (Math.abs(n) >= 1e4) return (n/1e4).toFixed(0) + '만원';
  return n.toLocaleString('ko-KR', {maximumFractionDigits: digits}) + '원';
}
function fmtFull(n) {
  return n.toLocaleString('ko-KR', {maximumFractionDigits: 0}) + '원';
}
function sign(n) { return n >= 0 ? '+' : ''; }
function cls(n)  { return n > 0 ? 'profit' : n < 0 ? 'loss' : 'neutral'; }
function fmtDate(d) {
  const dt = new Date(d);
  return dt.toLocaleDateString('ko-KR', {month:'long', day:'numeric', weekday:'short'});
}
function fmtDateShort(d) {
  const dt = new Date(d);
  return dt.toLocaleDateString('ko-KR', {month:'2-digit', day:'2-digit'});
}
function uuid() { return crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36); }

function drawPnLChart(chronological) {
  const canvas = document.getElementById('pnl-chart');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const W = canvas.offsetWidth;
  canvas.width = W * window.devicePixelRatio;
  canvas.height = 120 * window.devicePixelRatio;
  ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
  const w = W, h = 120;
  ctx.clearRect(0, 0, w, h);

  const values = chronological.map(r => r.totalPnL);
  const min = Math.min(...values, 0);
  const max = Math.max(...values, 0);
  const range = max - min || 1;

  const pad = { l: 4, r: 4, t: 12, b: 20 };
  const cw = w - pad.l - pad.r;
  const ch = h - pad.t - pad.b;

  const pts = values.map((v, i) => ({
    x: pad.l + (i / (values.length - 1 || 1)) * cw,
    y: pad.t + (1 - (v - min) / range) * ch
  }));

  const isProfit = values[values.length - 1] >= 0;
  const lineColor = isProfit ? '#ff453a' : '#0a84ff';

  // Gradient fill
  const grad = ctx.createLinearGradient(0, pad.t, 0, pad.t + ch);
  grad.addColorStop(0, isProfit ? 'rgba(255,69,58,.35)' : 'rgba(10,132,255,.35)');
  grad.addColorStop(1, 'rgba(0,0,0,0)');

  ctx.beginPath();
  pts.forEach((p, i) => i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y));
  ctx.lineTo(pts[pts.length-1].x, pad.t + ch);
  ctx.lineTo(pts[0].x, pad.t + ch);
  ctx.closePath();
  ctx.fillStyle = grad;
  ctx.fill();

  ctx.beginPath();
  pts.forEach((p, i) => i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y));
  ctx.strokeStyle = lineColor;
  ctx.lineWidth = 2;
  ctx.lineJoin = 'round';
  ctx.stroke();

  // Date labels
  ctx.fillStyle = 'rgba(128,128,128,.8)';
  ctx.font = '10px -apple-system';
  ctx.textAlign = 'center';
  const step = Math.max(1, Math.floor(chronological.length / 4));
  chronological.forEach((r, i) => {
    if (i % step === 0 || i === chronological.length - 1) {
      ctx.fillText(fmtDateShort(r.date), pts[i].x, h - 4);
    }
  });
}

function saveScanRecord() {
  const date = document.getElementById('scan-date').value;
  if (!date) { toast('날짜를 선택해주세요'); return; }
  const assets = scanAssetRows.filter(a => a.name.trim()).map(a => {
    const qty = parseFloat(a.qty) || 0;
    const avgPrice = parseFloat(a.avgPrice) || 0;
    // 매입금액 미입력 시 보유수량×매입단가로 자동 계산
    const buyAmount = parseFloat(a.buyAmount) || Math.round(qty * avgPrice);
    return {
      name: a.name.trim(), symbol: '',
      buyAmount, qty, avgPrice,
      evalAmount: parseFloat(a.evalAmount) || 0
    };
  });
  if (!assets.length) { toast('종목을 하나 이상 입력해주세요'); return; }

  if (editingRecordId) {
    // 수정 모드: 특정 기록 업데이트
    const idx = scanRecords.findIndex(r => r.id === editingRecordId);
    if (idx >= 0) {
      scanRecords[idx] = { ...scanRecords[idx], date, assets };
      toast('기록이 수정되었습니다');
    }
    editingRecordId = null;
  } else {
    // 같은 날짜 기록이 있으면 새로 추가하지 않고 업데이트
    const existing = scanRecords.find(r => r.date === date);
    if (existing) {
      existing.assets = assets;
      toast('기존 기록이 업데이트되었습니다');
    } else {
      scanRecords.push({ id: uuid(), date, assets });
      toast('기록이 저장되었습니다');
    }
  }
  save();
  closeModal('scan-modal');
  renderDashboard();
  renderRecords();
}

// ═══════════════════════════════════════════
//  OCR (Tesseract.js — iOS Safari 지원)
// ═══════════════════════════════════════════
let tesseractLoading = null;
function loadTesseract() {
  if (window.Tesseract) return Promise.resolve();
  if (!tesseractLoading) {
    tesseractLoading = new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
      s.onload = resolve;
      s.onerror = () => { tesseractLoading = null; reject(new Error('script load fail')); };
      document.head.appendChild(s);
    });
  }
  return tesseractLoading;
}

let ocrWorker = null;
async function getOcrWorker(statusEl) {
  if (ocrWorker) return ocrWorker;
  statusEl.textContent = 'OCR 엔진 로딩 중... (최초 1회, 잠시 걸립니다)';
  await loadTesseract();
  ocrWorker = await Tesseract.createWorker('kor+eng', 1, {
    logger: m => {
      if (m.status === 'recognizing text') {
        statusEl.textContent = `텍스트 인식 중... ${Math.round(m.progress * 100)}%`;
      } else if (m.status === 'loading language traineddata') {
        statusEl.textContent = `한글 인식 데이터 다운로드 중... ${Math.round((m.progress || 0) * 100)}%`;
      }
    }
  });
  return ocrWorker;
}

async function runOCR(dataURL) {
  const statusEl = document.getElementById('ocr-status');
  statusEl.style.display = 'block';
  statusEl.textContent = '준비 중...';
  try {
    const worker = await getOcrWorker(statusEl);
    const { data } = await worker.recognize(dataURL);
    const parsed = parseAssetsFromText(data.text);
    statusEl.style.display = 'none';
    if (!parsed.length) {
      toast('종목을 인식하지 못했습니다 — 사진을 보며 직접 입력해 주세요');
      return;
    }
    applyParsedAssets(parsed);
  } catch (err) {
    statusEl.style.display = 'none';
    console.log('OCR 실패:', err);
    toast('자동 인식 실패 — 사진을 보며 직접 입력해 주세요');
  }
}

// OCR 텍스트 파싱 — 라벨 구조 → 컴팩트 잔고 목록 → 일반 휴리스틱 순으로 시도
function parseAssetsFromText(text) {
  // HTML 엔티티 및 인코딩 정규화 (&amp; → &, 전각 & → &)
  const normalized = text.replace(/&amp;/g, '&').replace(/＆/g, '&');
  const lines = normalized.split('\n').map(l => l.trim()).filter(Boolean);
  const structured = parseStructuredBlocks(lines);
  if (structured.length) return structured;
  const compact = parseCompactBlocks(lines);
  if (compact.length) return compact;
  return parseGenericBlocks(lines);
}

function ocrNum(s) {
  const m = s.match(/\d{1,3}(?:,\d{3})+(?:\.\d+)?|\d+(?:\.\d+)?/);
  return m ? parseFloat(m[0].replace(/,/g, '')) : null;
}

// OCR 상품명 후처리: 끝에 붙는 노이즈 제거 + 폰트 오인식 보정
function cleanOcrName(name) {
  let s = name;
  // 일부 증권앱 폰트에서 S→5, P→0 오인식 보정 ("미국5&0500" → "미국S&P500")
  s = s.replace(/5(&|＆)0(\d+)/g, 'S$1P$2');
  // 앞부분 깨진 노이즈 제거: 정상 ETF명 패턴(알파벳 대문자/숫자/한글 ETF 키워드) 이전에
  // 특수문자·그리스문자·대괄호가 섞인 쓰레기가 있으면 제거
  // 예: "미56π[062040액티브 적격" → 앞 쓰레기 제거 후 "062040액티브 적격"은 여전히 이상하므로
  // 실제 ETF 키워드 앞 노이즈(특수문자 포함 구간)를 날림
  s = s.replace(/^[^A-Za-z가-힣0-9]*(?=[A-Z가-힣])/, ''); // 맨 앞 특수문자 제거
  // 이름 안에 특수문자([, π, ], < 등)가 포함된 경우 해당 특수문자까지 앞을 제거
  const specialIdx = s.search(/[\[\]π<>{}|\\^~`@#$%*_]/);
  if (specialIdx > 0 && specialIdx < s.length - 3) {
    // 특수문자 뒤에 한글 ETF 키워드나 숫자가 있으면 그 앞 쓰레기 제거
    const after = s.slice(specialIdx + 1);
    if (/[가-힣A-Za-z0-9]/.test(after)) s = after.replace(/^[^A-Za-z가-힣0-9]*/, '');
  }
  // 후미 소문자 한 글자 제거 ("적격 f" → "적격")
  s = s.replace(/\s+[a-z]$/i, m => /[A-Z]/.test(m) ? m : '');
  // 후미 한글 한 글자 괄호 제거 ("액티브(너)" → "액티브")
  s = s.replace(/\([가-힣]\)\s*$/, '');
  // 닫는 괄호가 여는 괄호보다 많으면 맨 뒤 ) 제거
  const op = (s.match(/\(/g) || []).length;
  const cl = (s.match(/\)/g) || []).length;
  if (cl > op) s = s.replace(/\)\s*$/, '');
  return s.trim();
}

// 증권앱 라벨 구조 파싱:
//   종목명
//   매입금액            7,966,500원
//   보유수량/매입단가    500주 / 15,933원
//   평가금액            6,775,000원
// "매입금액" 라벨을 기준으로 역방향으로 이름 탐지 — OCR 노이즈로 이름 앞쪽에
// 불필요한 텍스트가 끼더라도 정확한 이름을 찾을 수 있도록 개선
function parseStructuredBlocks(lines) {
  const results = [];
  const labelRe = /매입\s*금액|보유\s*수량|매입\s*단가|평가\s*금액|평가\s*손익|수익률/;
  const noiseRe = /^(매수|매도|ETF|금융상품|디폴트|연금계좌|관심종목|투자NOW|MY자산|메뉴|홈|국내|해외|예수금|체결|주문|차트|리츠)/;
  const isJunk = s => {
    if (!s || s.length < 2) return true;
    if (/^[\d,.\s%원주\/▲▼()+\-]+$/.test(s)) return true;
    if (labelRe.test(s)) return true;
    if (noiseRe.test(s)) return true;
    return false;
  };

  for (let i = 1; i < lines.length; i++) {
    const l = lines[i];
    // "매입금액" 라벨 라인을 기준점으로 사용
    if (!/매입\s*금액/.test(l)) continue;

    // 이름: 매입금액 바로 위 유효한 라인을 역방향 탐색 (최대 4줄 위까지)
    // 이름이 여러 줄로 나뉜 경우("RISE TDF2040액티브" + "적격") 합산
    let name = null;
    for (let k = i - 1; k >= Math.max(0, i - 4); k--) {
      const candidate = lines[k]
        .replace(/[<>›〉‹▲▼]/g, '')
        .replace(/\s*[>›]+\s*$/, '')
        .trim();
      if (!isJunk(candidate)) {
        name = candidate.replace(/\s+/g, ' ');
        // 이름이 짧고 한글만인 경우(suffix일 가능성) → 윗 줄과 합산 시도
        const isLikelySuffix = name.replace(/\s/g, '').length <= 4 && !/[A-Za-z0-9]/.test(name);
        if (isLikelySuffix && k > 0) {
          const above = lines[k - 1].replace(/[<>›〉‹▲▼]/g, '').replace(/\s*[>›]+\s*$/, '').trim();
          if (!isJunk(above) && /[가-힣A-Za-z]/.test(above)) {
            name = above.replace(/\s+/g, ' ') + ' ' + name;
          }
        }
        break;
      }
    }
    if (!name || name.length < 2) continue;

    // 매입금액 값 추출
    const investment = ocrNum(l.replace(/매입\s*금액/, ''));

    // 이후 ~7줄에서 보유수량/매입단가, 평가금액 수집
    let qty = null, avgPrice = null, value = null;
    let consumed = i;
    for (let j = i + 1; j < Math.min(i + 8, lines.length); j++) {
      const lj = lines[j];
      if (qty === null) {
        const qm = lj.match(/(\d{1,3}(?:,\d{3})*)\s*주\s*[\/|]?\s*(\d{1,3}(?:,\d{3})*)\s*원?/);
        if (qm) {
          qty = parseFloat(qm[1].replace(/,/g, ''));
          avgPrice = parseFloat(qm[2].replace(/,/g, ''));
        }
      }
      if (value === null && /평가\s*금액/.test(lj)) {
        value = ocrNum(lj.replace(/평가\s*금액/, ''));
        consumed = j;
        break;
      }
    }

    if (qty > 0 && value > 0) {
      if (investment && (!avgPrice || Math.abs(qty * avgPrice - investment) / investment > 0.05)) {
        avgPrice = Math.round(investment / qty);
      }
      const cleanName = cleanOcrName(name);
      const normName = cleanName.replace(/\s+/g, '').toLowerCase();
      // 동일 이름 중복 방지
      if (!results.some(r => r.name.replace(/\s+/g, '').toLowerCase() === normName)) {
        results.push({
          name: cleanName,
          buyAmount: investment || Math.round(qty * (avgPrice || 0)),
          qty,
          avgPrice: avgPrice || 0,
          evalAmount: value,
          structured: true
        });
      }
      i = consumed;
    }
  }
  return results;
}

// 컴팩트 잔고 목록 파싱 (잔고 화면):
//   TIGER 미국S&P500         77,546,000원
//   2800주 · 평단 24,465원   +904만원 (+13.20%)
// "N주 · 평단 N원" 패턴을 앵커로 사용
function parseCompactBlocks(lines) {
  const results = [];
  // "N주 · 평단 N원" — 중점(·) 또는 일반 점, OCR 오차 허용
  const qtyRe = /(\d{1,3}(?:,\d{3})*)\s*주\s*[·・.]\s*평단\s*(\d{1,3}(?:,\d{3})*)\s*원/;

  for (let i = 1; i < lines.length; i++) {
    const qm = lines[i].match(qtyRe);
    if (!qm) continue;

    const qty = parseFloat(qm[1].replace(/,/g, ''));
    const avgPrice = parseFloat(qm[2].replace(/,/g, ''));
    if (qty <= 0 || avgPrice <= 0) continue;

    // 위 1~2줄에서 종목명과 평가금액 탐색
    let name = null, evalAmount = null;
    for (let k = i - 1; k >= Math.max(0, i - 3); k--) {
      const prev = lines[k];
      // 이 줄에 금액(원)이 포함된 경우 — 종목명과 평가금액이 같은 줄
      const amtM = prev.match(/(\d{1,3}(?:,\d{3})+)\s*원/);
      if (amtM) {
        const v = parseFloat(amtM[1].replace(/,/g, ''));
        if (v > avgPrice) { // 평단가보다 커야 평가금액
          evalAmount = v;
          const namePart = prev.slice(0, prev.indexOf(amtM[0])).replace(/[<>›〉‹▲▼]/g, '').trim();
          if (namePart.length >= 2) name = cleanOcrName(namePart.replace(/\s+/g, ' '));
        }
      } else if (!name && prev.length >= 2 && !/^[\d,.\s%+\-원주·]+$/.test(prev)) {
        const candidate = cleanOcrName(prev.replace(/[<>›〉‹▲▼]/g, '').replace(/\s+/g, ' ').trim());
        // suffix처럼 짧고 한글만인 경우 → 한 줄 더 위에서 이름 탐색하여 합산
        const isLikelySuffix = candidate.replace(/\s/g, '').length <= 4 && !/[A-Za-z0-9]/.test(candidate);
        if (isLikelySuffix && k > 0) {
          const above = lines[k - 1].replace(/[<>›〉‹▲▼]/g, '').replace(/\s+/g, ' ').trim();
          if (above.length >= 2 && !/^[\d,.\s%+\-원주·]+$/.test(above)) {
            name = cleanOcrName(above + ' ' + candidate);
            k--; // 이미 처리했으므로 건너뜀
          } else { name = candidate; }
        } else { name = candidate; }
      }
      if (name && evalAmount) break;
    }

    // 평가금액이 같은 줄에 없으면 바로 위 줄에서 별도 탐색
    if (!evalAmount) {
      for (let k = Math.max(0, i - 2); k < i; k++) {
        const amtM = lines[k].match(/(\d{1,3}(?:,\d{3})+)\s*원/);
        if (amtM) {
          const v = parseFloat(amtM[1].replace(/,/g, ''));
          if (v > avgPrice) { evalAmount = v; break; }
        }
      }
    }

    if (!name || !evalAmount || qty <= 0) continue;
    const normName = name.replace(/\s+/g, '').toLowerCase();
    if (results.some(r => r.name.replace(/\s+/g, '').toLowerCase() === normName)) continue;

    results.push({
      name,
      buyAmount: Math.round(qty * avgPrice),
      qty, avgPrice,
      evalAmount,
      structured: true
    });
  }
  return results;
}

// 일반 휴리스틱: 종목명 + 주변 숫자 수집 (라벨 구조가 아닌 화면용)
function parseGenericBlocks(lines) {
  const uiWords = /^(매수|매도|평가금액|평가손익|손익|수익률|총평가|총매입|매입금액|예수금|잔고|계좌|종목명|현재가|수량|보유수량|평균단가|매입단가|등락|전일대비|원|주|체결|주문|차트|관심|국내|해외|합계|총|자산|투자|금액)$/;
  const nameRe = /^([가-힣A-Za-z][가-힣A-Za-z0-9&(). \-\s]*[가-힣A-Za-z0-9])/;
  const hasNum = s => /\d{2,}/.test(s);
  const results = [];

  for (let i = 0; i < lines.length; i++) {
    const m = lines[i].match(nameRe);
    if (!m) continue;
    let name = m[1].replace(/\s+/g, ' ').trim();
    if (name.length < 2 || uiWords.test(name)) continue;

    // 이름 뒤에 숫자가 없고 다음 줄이 이름 연속인 경우 합산
    // (예: "RISE TDF2040액티브" 다음 줄에 "적격"이 오는 경우)
    const afterName = lines[i].slice(m[0].length).trim();
    if (!afterName && i + 1 < lines.length) {
      const nextLine = lines[i + 1].trim();
      const nm = nextLine.match(nameRe);
      if (nm && !hasNum(nextLine) && !uiWords.test(nm[1].trim())) {
        name = name + ' ' + nm[1].replace(/\s+/g, ' ').trim();
        i++; // 다음 줄은 이름으로 소비
      }
    }

    const numText = [lines[i].slice(m[0].length), lines[i + 1] || '', lines[i + 2] || ''].join(' ');
    const nums = (numText.match(/\d{1,3}(?:,\d{3})+(?:\.\d+)?|\d+(?:\.\d+)?/g) || [])
      .map(s => parseFloat(s.replace(/,/g, '')))
      .filter(n => n > 0);
    if (!nums.length) continue;
    const dup = results.find(r => r.name === name);
    if (dup) { if (nums.length > dup.nums.length) dup.nums = nums; continue; }
    results.push({ name, nums, structured: false });
  }
  return results;
}

// 인식 결과를 이전 기록과 병합 — 변경된 부분만 업데이트
function applyParsedAssets(parsed) {
  const latest = enrich(sortedRecords())[0];
  const prevAssets = latest ? latest.assets : [];
  const norm = s => s.replace(/\s+/g, '').toLowerCase();
  const rows = [];
  const changes = [];
  const matchedPrev = new Set();

  parsed.forEach(p => {
    const prev = prevAssets.find(a => {
      const n1 = norm(a.name), n2 = norm(p.name);
      return n1 === n2 || (n1.length >= 3 && n2.includes(n1)) || (n2.length >= 3 && n1.includes(n2));
    });

    if (p.structured) {
      // 라벨 구조 인식: 5개 항목(상품명/매입금액/보유수량/매입단가/평가금액) 그대로 매핑
      if (prev) {
        matchedPrev.add(norm(prev.name));
        const evalChanged = p.evalAmount !== prev.evalAmount;
        const qtyChanged  = p.qty !== prev.qty;
        const buyChanged  = p.buyAmount > 0 && p.buyAmount !== prev.buyAmount;
        rows.push({
          id: uuid(), name: prev.name,
          buyAmount: String(p.buyAmount > 0 ? p.buyAmount : prev.buyAmount),
          qty: String(p.qty),
          avgPrice: String(p.avgPrice > 0 ? p.avgPrice : prev.avgPrice),
          evalAmount: String(p.evalAmount),
          _changed: evalChanged || qtyChanged || buyChanged
        });
        if (evalChanged || qtyChanged || buyChanged) {
          const parts = [];
          if (evalChanged) parts.push(`평가 ${prev.evalAmount.toLocaleString()} → <b>${p.evalAmount.toLocaleString()}원</b>`);
          if (qtyChanged) parts.push(`${prev.qty}주 → <b>${p.qty}주</b>`);
          if (buyChanged) parts.push(`매입 ${p.buyAmount.toLocaleString()}원`);
          changes.push(`<span style="color:var(--orange)">↻</span> ${prev.name}: ${parts.join(' · ')}`);
        } else {
          changes.push(`<span style="color:var(--txt3)">=</span> ${prev.name}: 변동 없음`);
        }
      } else {
        const nameWarn = p.name.length < 5 || !/[A-Za-z0-9]/.test(p.name);
        rows.push({
          id: uuid(), name: p.name,
          buyAmount: String(p.buyAmount), qty: String(p.qty),
          avgPrice: String(p.avgPrice), evalAmount: String(p.evalAmount),
          _changed: true, _nameWarning: nameWarn
        });
        changes.push(`<span style="color:var(--green)">＋</span> ${p.name}${nameWarn ? ' ⚠️' : ''}: 신규 ${p.qty}주 · 평가 ${p.evalAmount.toLocaleString()}원`);
      }
    } else if (prev) {
      // 일반 휴리스틱 + 기존 종목: 이전 평가금액 ±35% 이내 가장 가까운 숫자를 새 평가금액으로
      matchedPrev.add(norm(prev.name));
      let newEval = prev.evalAmount, bestRatio = Infinity;
      p.nums.forEach(n => {
        if (n === prev.qty || n === prev.avgPrice || n === prev.buyAmount) return;
        const ratio = Math.abs(n - prev.evalAmount) / Math.max(prev.evalAmount, 1);
        if (ratio < 0.35 && ratio < bestRatio) { bestRatio = ratio; newEval = n; }
      });
      const evalChanged = newEval !== prev.evalAmount;
      rows.push({
        id: uuid(), name: prev.name,
        buyAmount: String(prev.buyAmount), qty: String(prev.qty),
        avgPrice: String(prev.avgPrice), evalAmount: String(newEval),
        _changed: evalChanged
      });
      changes.push(evalChanged
        ? `<span style="color:var(--orange)">↻</span> ${prev.name}: 평가 ${prev.evalAmount.toLocaleString()} → <b>${newEval.toLocaleString()}원</b>`
        : `<span style="color:var(--txt3)">=</span> ${prev.name}: 변동 없음`);
    } else {
      // 일반 휴리스틱 + 신규 종목: 최대 숫자를 평가금액으로 추정
      const sortedNums = [...p.nums].sort((a, b) => b - a);
      const evalAmount = sortedNums[0] || 0;
      const intCandidates = p.nums.filter(n => Number.isInteger(n) && n < evalAmount && n <= 100000);
      const qty = intCandidates.length ? Math.min(...intCandidates) : 0;
      rows.push({
        id: uuid(), name: p.name,
        buyAmount: '', qty: qty ? String(qty) : '',
        avgPrice: '', evalAmount: evalAmount ? String(evalAmount) : '',
        _changed: true
      });
      changes.push(`<span style="color:var(--green)">＋</span> ${p.name}: 신규 (평가금액 추정 ${evalAmount ? evalAmount.toLocaleString() + '원' : '미인식'})`);
    }
  });

  // 사진에 없는 기존 종목은 이전 값 그대로 유지
  prevAssets.forEach(a => {
    if (!matchedPrev.has(norm(a.name))) {
      rows.push({
        id: uuid(), name: a.name,
        buyAmount: String(a.buyAmount), qty: String(a.qty),
        avgPrice: String(a.avgPrice), evalAmount: String(a.evalAmount),
        _changed: false
      });
      changes.push(`<span style="color:var(--txt3)">＝</span> ${a.name}: 사진에 없음 — 이전 값 유지`);
    }
  });

  scanAssetRows = rows;
  renderScanAssets();

  const summaryEl = document.getElementById('ocr-summary');
  summaryEl.innerHTML = `<div style="font-weight:600;margin-bottom:4px;font-size:13px">자동 인식 결과 — 확인 후 저장하세요</div>${changes.join('<br>')}`;
  summaryEl.style.display = 'block';
  toast(`${parsed.length}개 종목 인식 완료`);
}

// ═══════════════════════════════════════════
//  REBALANCING
// ═══════════════════════════════════════════
function renderRebal() {
  const el = document.getElementById('rebal-content');
  const sorted = enrich(sortedRecords());
  const latest = sorted[0];

  if (!latest) {
    el.innerHTML = `<div class="empty"><div class="empty-icon">⚖️</div><div class="empty-title">기록이 없습니다</div><div class="empty-desc">대시보드에서 ＋ 버튼으로<br>자산 기록을 먼저 추가해주세요</div></div>`;
    return;
  }

  const assets = latest.assets || [];
  if (!assets.length) {
    el.innerHTML = `<div class="empty"><div class="empty-icon">⚖️</div><div class="empty-title">종목이 없습니다</div></div>`;
    return;
  }

  const totalVal = latest.totalValue;
  const weights = settings.targetWeights || {};
  let totalTarget = 0;
  assets.forEach(a => { totalTarget += (weights[a.name] || 0); });
  const weightOk = Math.abs(totalTarget - 100) < 0.5;
  const colors = ['#ff453a','#0a84ff','#30d158','#ffd60a','#ff9f0a','#bf5af2','#64d2ff','#ff6961'];

  let html = `<div style="height:8px"></div>`;

  // Summary card
  html += `<div class="card">
    <div class="card-row"><span style="color:var(--txt2)">기준 일자</span><span style="font-weight:600">${fmtDate(latest.date)}</span></div>
    <div class="card-row"><span style="color:var(--txt2)">총 평가금액</span><span style="font-weight:700">${fmtFull(totalVal)}</span></div>
    <div class="card-row">
      <span style="color:var(--txt2)">목표 비중 합계</span>
      <span id="rebal-total-weight" style="font-weight:600;color:${weightOk ? 'var(--green)' : 'var(--red)'}">
        ${totalTarget.toFixed(1)}% ${weightOk ? '✓' : '⚠️ 합계 100% 맞춰주세요'}
      </span>
    </div>
  </div>`;

  // Weight bar (target weights)
  if (totalTarget > 0) {

      <div style="display:flex;height:12px;border-radius:6px;overflow:hidden;gap:2px;margin-bottom:12px">`;
    assets.forEach((a, i) => {
      const w = weights[a.name] || 0;
      if (w > 0) html += `<div style="flex:${w};background:${colors[i % colors.length]};min-width:2px"></div>`;
    });
    html += `</div>`;
    assets.forEach((a, i) => {
      const w = weights[a.name] || 0;
      if (w <= 0) return;
      html += `<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
        <div style="width:12px;height:12px;border-radius:3px;background:${colors[i % colors.length]};flex-shrink:0"></div>

        <div style="font-size:12px;font-weight:600">${w}%</div>

    const curPct = totalVal > 0 ? (a.evalAmount / totalVal) * 100 : 0;

    const dev = curPct - targetPct;
    const hasTgt = targetPct > 0;
    const devCls = hasTgt ? (Math.abs(dev) < 2 ? 'badge-ok' : dev > 0 ? 'badge-over' : 'badge-buy') : 'badge-over';
    const devTxt = hasTgt ? `${Math.abs(dev) < 2 ? '균형' : dev > 0 ? '초과' : '부족'} ${sign(dev)}${Math.abs(dev).toFixed(1)}%` : '미설정';
    html += `<div style="padding:12px 16px;border-bottom:0.5px solid var(--sep)" data-name="${a.name}">

            data-idx="${idx}" data-cur="${curPct.toFixed(4)}"
            oninput="updateTargetWeightEl(this)">
          <span style="font-size:12px;color:var(--txt2)">%</span>
        </div>
      </div>
    </div>`;
  });

  html += `<div class="btn-wrap">
    <button class="btn btn-primary" onclick="openCalcModal()">리밸런싱 계산하기</button>
  </div>
  <div class="btn-wrap" style="padding-top:0">
    <button class="btn btn-secondary" onclick="setEqualWeights()">균등 배분 자동 설정</button>
  </div>
  <div style="height:8px"></div>`;

  el.innerHTML = html;
}

function updateTargetWeightEl(input) {
  const row = input.closest('[data-name]');
  const name = row ? row.dataset.name : null;
  const idx = parseInt(input.dataset.idx, 10);
  const curPct = parseFloat(input.dataset.cur) || 0;
  if (!name) return;
  if (!settings.targetWeights) settings.targetWeights = {};
  settings.targetWeights[name] = parseFloat(input.value) || 0;
  LS.set('settings', settings);

  const latest = enrich(sortedRecords())[0];
  if (!latest) return;
  let total = 0;
  (latest.assets || []).forEach(a => total += (settings.targetWeights[a.name] || 0));
  const weightOk = Math.abs(total - 100) < 0.5;
  const totalEl = document.getElementById('rebal-total-weight');
  if (totalEl) {
    totalEl.textContent = total.toFixed(1) + '% ' + (weightOk ? '✓' : '⚠️ 합계 100% 맞춰주세요');
    totalEl.style.color = weightOk ? 'var(--green)' : 'var(--red)';
  }

  const targetPct = settings.targetWeights[name] || 0;
  const dev = curPct - targetPct;
  const hasTgt = targetPct > 0;
  const devCls = hasTgt ? (Math.abs(dev) < 2 ? 'badge-ok' : dev > 0 ? 'badge-over' : 'badge-buy') : 'badge-over';
  const devTxt = hasTgt ? (Math.abs(dev) < 2 ? '균형' : dev > 0 ? '초과' : '부족') + ' ' + sign(dev) + Math.abs(dev).toFixed(1) + '%' : '미설정';
  const badge = document.getElementById('rebal-badge-' + idx);
  if (badge) { badge.className = 'badge ' + devCls; badge.textContent = devTxt; }
}

function setEqualWeights() {
  const latest = enrich(sortedRecords())[0];
  if (!latest || !latest.assets.length) return;
  const assets = latest.assets;
  const base = Math.floor(100 / assets.length);
  const extra = 100 - base * assets.length;
  if (!settings.targetWeights) settings.targetWeights = {};
  assets.forEach((a, i) => { settings.targetWeights[a.name] = base + (i === 0 ? extra : 0); });
  LS.set('settings', settings);
  renderRebal();
}

function openCalcModal() {
  document.getElementById('calc-amount').value = '';
  document.getElementById('calc-results').innerHTML = '';
  openModal('calc-modal');
}

function runRebalCalc() {
  const additional = parseFloat(document.getElementById('calc-amount').value) || 0;
  if (additional <= 0) { toast('투자금액을 입력해주세요'); return; }

  const latest = enrich(sortedRecords())[0];
  if (!latest) { toast('자산 기록이 없습니다'); return; }

  const assets = latest.assets || [];
  const weights = settings.targetWeights || {};
  const totalCur = latest.totalValue;
  const newTotal = totalCur + additional;

  const prepared = assets.map(a => {
    const targetPct = weights[a.name] || 0;
    const targetKRW = (targetPct / 100) * newTotal;
    const curKRW = a.evalAmount;
    const deficit = Math.max(0, targetKRW - curKRW);
    // Estimate current price per share from evalAmount / qty
    const currentPrice = a.qty > 0 ? Math.round(a.evalAmount / a.qty) : (a.avgPrice || 0);
    return { name: a.name, targetPct, targetKRW, curKRW, deficit, currentPrice };
  });

  const totalDeficit = prepared.reduce((s, d) => s + d.deficit, 0);

  const results = prepared.map(d => {
    let buyKRW = 0;
    if (d.deficit > 0) {
      buyKRW = totalDeficit <= additional ? d.deficit : additional * (d.deficit / totalDeficit);
    }
    const buyQty = d.currentPrice > 0 ? Math.floor(buyKRW / d.currentPrice) : 0;
    const actualBuy = buyQty * d.currentPrice;
    return { ...d, buyQty, actualBuy };
  });

  const spent = results.reduce((s, r) => s + r.actualBuy, 0);
  const leftover = additional - spent;

  let html = `<div class="section-header" style="margin-top:4px">매수 추천</div><div class="card">`;
  results.forEach(r => {
    if (r.targetPct === 0) return;
    if (r.deficit <= 0) {
      html += `<div class="card-row"><div><div style="font-weight:500">${r.name}</div><div style="font-size:12px;color:var(--txt2)">초과 보유 — 매수 불필요</div></div><span class="badge badge-ok">보유중</span></div>`;
    } else if (r.buyQty > 0) {
      html += `<div class="card-row">
        <div><div style="font-weight:500">${r.name}</div>
        <div style="font-size:12px;color:var(--txt2);margin-top:2px">${r.buyQty}주 × ${r.currentPrice.toLocaleString()}원</div></div>
        <div style="text-align:right"><div style="font-weight:700;color:var(--red)">${fmtFull(r.actualBuy)}</div>
        <div style="font-size:12px;color:var(--txt2)">${r.buyQty}주</div></div>
      </div>`;
    } else {
      html += `<div class="card-row"><div><div style="font-weight:500">${r.name}</div><div style="font-size:12px;color:var(--txt2)">부족 — 1주 매수 불가</div></div><span class="badge badge-buy">부족</span></div>`;
    }
  });
  html += `</div>
  <div class="card" style="margin-top:8px">
    <div class="card-row"><span style="color:var(--txt2)">추가 투자금</span><span>${fmtFull(additional)}</span></div>
    <div class="card-row"><span style="color:var(--txt2)">투자 후 총액</span><span style="font-weight:600">${fmtFull(newTotal)}</span></div>
    <div class="card-row"><span style="color:var(--txt2)">사용금액</span><span style="font-weight:600">${fmtFull(spent)}</span></div>
    <div class="card-row"><span style="color:var(--txt2)">잔여금</span><span style="color:var(--green);font-weight:600">${fmtFull(leftover)}</span></div>
  </div>`;

  document.getElementById('calc-results').innerHTML = html;
}

function exportData() {
  const data = { scanRecords, portfolio, exportedAt: new Date().toISOString() };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'asset-scanner-backup.json';
  a.click();
  toast('내보내기 완료');
}
function importData() {
  const input = document.createElement('input');
  input.type = 'file'; input.accept = '.json';
  input.onchange = e => {
    const file = e.target.files[0];
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const data = JSON.parse(ev.target.result);
        if (data.scanRecords) scanRecords = data.scanRecords;
        if (data.portfolio)   portfolio   = data.portfolio;
        save();
        renderDashboard(); renderRecords(); renderRebal(); renderSettings();
        toast('불러오기 완료');
      } catch { toast('파일 형식이 올바르지 않습니다'); }
    };
    reader.readAsText(file);
  };
  input.click();
}

// ═══════════════════════════════════════════
//  EXCHANGE RATE  (다중 소스 폴백)
// ═══════════════════════════════════════════
const RATE_SOURCES = [
  // 1차: Frankfurter (ECB 기반, 무료·CORS 허용)
  async () => {
    const res = await fetch('https://api.frankfurter.app/latest?from=USD&to=KRW');
    const data = await res.json();
    const rate = data.rates?.KRW;
    if (!rate) throw new Error('no KRW');
    return { rate, source: 'Frankfurter' };
  },
  // 2차: fawazahmed0 Currency API (jsDelivr CDN, 항상 접근 가능)
  async () => {
    const res = await fetch('https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/usd.json');
    const data = await res.json();
    const rate = data.usd?.krw;
    if (!rate) throw new Error('no KRW');
    return { rate: Math.round(rate), source: 'CDN(fawazahmed0)' };
  },
  // 3차: Open Exchange Rates (무료 플랜, 시간 1회 제한)
  async () => {
    const res = await fetch('https://open.er-api.com/v6/latest/USD');
    const data = await res.json();
    const rate = data.rates?.KRW;
    if (!rate) throw new Error('no KRW');
    return { rate: Math.round(rate), source: 'open.er-api' };
  }
];

async function fetchRate() {
  for (const fn of RATE_SOURCES) {
    try {
      const { rate, source } = await fn();
      usdKrw = rate;
      usdKrwTime = new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' }) + ' (' + source + ')';
      if (settings.alertEnabled && rate <= settings.alertThreshold && 'Notification' in window && Notification.permission === 'granted') {
        new Notification('환율 알림', { body: `USD/KRW ${rate.toFixed(0)}원 (기준 ${settings.alertThreshold}원 이하)`, icon: 'icon.svg' });
      }
      if (document.getElementById('screen-rebal').classList.contains('active')) renderRebal();
      return;
    } catch (e) {
      console.log('환율 소스 실패, 다음 시도:', e.message);
    }
  }
  console.log('모든 환율 소스 실패');
}

function openModal(id) {
  document.getElementById(id).classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeModal(id) {
  document.getElementById(id).classList.remove('open');
  document.body.style.overflow = '';
}

// Close on backdrop tap
document.querySelectorAll('.modal-overlay').forEach(el => {
  el.addEventListener('click', e => { if (e.target === el) closeModal(el.id); });
});

//  TOAST
// ═══════════════════════════════════════════
let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2500);
}

function init() {
  // Load sample data on first run
  if (!localStorage.getItem('scanRecords') && !localStorage.getItem('portfolio')) {
    loadSampleRecords();
    loadSamplePortfolio();
    return; // switchTab called inside
  }
  renderDashboard();
  fetchRate();

  setInterval(fetchRate, 30 * 60 * 1000);
}
