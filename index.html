<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>앱 허브</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0f0f1a;
      color: #eaeaea;
      font-family: 'Apple SD Gothic Neo', 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 20px;
    }
    h1 {
      font-size: 1.8rem;
      font-weight: 800;
      background: linear-gradient(135deg, #e94560, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
    }
    .sub { color: #666; font-size: 0.9rem; margin-bottom: 40px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      width: 100%;
      max-width: 700px;
    }
    a.card {
      background: #1a1a2e;
      border: 1px solid #2a2a4a;
      border-radius: 16px;
      padding: 28px 20px;
      text-align: center;
      text-decoration: none;
      color: #eaeaea;
      transition: border-color 0.2s, transform 0.15s;
    }
    a.card:hover { border-color: #e94560; transform: translateY(-3px); }
    a.card .icon { font-size: 2.8rem; margin-bottom: 12px; }
    a.card .name { font-size: 1.1rem; font-weight: 700; }
    a.card .desc { font-size: 0.8rem; color: #666; margin-top: 6px; }
  </style>
</head>
<body>
  <h1>🗂 앱 모음</h1>
  <p class="sub">아래 앱을 선택하세요</p>
  <div class="grid">
    <a class="card" href="ladder/">
      <div class="icon">🪜</div>
      <div class="name">사다리 게임</div>
      <div class="desc">참가자와 결과를 입력하고 사다리를 타세요</div>
    </a>
    <a class="card" href="badminton/">
      <div class="icon">🏸</div>
      <div class="name">배드민턴</div>
      <div class="desc">복식 경기 시뮬레이터</div>
    </a>
    <a class="card" href="rebalancing/">
      <div class="icon">📊</div>
      <div class="name">자산 리밸런싱</div>
      <div class="desc">포트폴리오 리밸런싱 앱</div>
    </a>
    <a class="card" href="message-sender/">
      <div class="icon">📨</div>
      <div class="name">빠른 메시지 발송</div>
      <div class="desc">문자·카카오톡 빠른 발송</div>
    </a>
  </div>
</body>
</html>
